spring.application.name=majung

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# 모험 정책 (환경변수로 조정 가능)
adventure.hint-view-seconds=${HINT_VIEW_SECONDS:60}
adventure.arrival-radius-meters=${MISSION_ARRIVAL_RADIUS_METERS:100}
adventure.max-mission-count=${MAX_MISSION_COUNT:20}
