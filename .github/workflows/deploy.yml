name: Build image and update GitOps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an in-flight production rollout.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOY_REPOSITORY || 'parafara/durumungsil-backend-deploy' }}
          ref: ${{ vars.DEPLOY_REF || 'main' }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ vars.KUBECTL_VERSION || 'v1.36.1' }}

      - name: Update deployment image by digest
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl set image --local -f deploy/kubernetes/deployment.yaml \
            durumungsil-api="${IMAGE}@${DIGEST}" -o yaml > "${RUNNER_TEMP}/deployment.yaml"
          # kubectl emits no object when the image is already unchanged.
          if [[ ! -s "${RUNNER_TEMP}/deployment.yaml" ]]; then
            echo 'Deployment already references this image digest.'
            exit 0
          fi
          cp "${RUNNER_TEMP}/deployment.yaml" deploy/kubernetes/deployment.yaml
          git -C deploy config user.name 'github-actions[bot]'
          git -C deploy config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C deploy add kubernetes/deployment.yaml
          if git -C deploy diff --cached --quiet; then
            echo 'Deployment already references this image digest.'
            exit 0
          fi
          git -C deploy commit -m "chore: deploy durumungsil-api ${GITHUB_SHA}"
          git -C deploy push
