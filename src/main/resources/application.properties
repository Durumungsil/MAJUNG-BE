spring.application.name=majung

# 배포 환경(Railway·Render 등)이나 도커가 PORT 를 넣어 주면 그 포트로, 없으면 8080
server.port=${PORT:8080}
# 서명·압축한 추천 cursor를 GET 요청으로 전달한다. 프록시도 같은 상한을 허용해야 한다.
server.max-http-request-header-size=64KB

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Supabase 풀러(세션 모드)는 같은 DB 사용자 기준 동시 연결 수가 정해져 있다(예: 15).
# 서버 인스턴스(로컬 실행·도커·팀원 PC)마다 이만큼 연결을 잡으므로 작게 둔다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# 운영 스키마 변경은 docs/migrations SQL로 먼저 적용한다.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.jackson.property-naming-strategy=SNAKE_CASE

# JWT - access 토큰은 짧게, refresh 토큰은 길게
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=${JWT_ACCESS_TOKEN_VALIDITY:1h}
jwt.refresh-token-validity=${JWT_REFRESH_TOKEN_VALIDITY:14d}

# 구글 OAuth 클라이언트 ID (웹/안드로이드/iOS 여러 개면 콤마로 구분)
google.client-ids=${GOOGLE_CLIENT_IDS}

# CORS - 프론트 주소 (콤마로 구분, 배포하면 https://도메인 추가)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8000,http://localhost:8001,http://localhost:8080}

# Gemini (AI 타임라인) - 키가 비어 있으면 규칙 기반 배치로 동작
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.timeout=${GEMINI_TIMEOUT:30s}
# 알레르기 원문 전송은 유료 등급을 확인한 운영자만 명시적으로 활성화한다.
gemini.paid-tier-confirmed=${GEMINI_PAID_TIER_CONFIRMED:false}

# Places는 서버 키로만 호출한다. Place Details는 location 필드만 요청한다.
google.places.api-key=${GOOGLE_PLACES_API_KEY:}
google.places.timeout=${GOOGLE_PLACES_TIMEOUT:10s}
google.places.cursor-secret=${GOOGLE_PLACES_CURSOR_SECRET:${JWT_SECRET}}
